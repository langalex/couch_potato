name: Ruby CI
on:
  push:
    branches:
      - master
      - 1.x
  pull_request:
    branches:
      - master
      - 1.x
jobs:
  test:
    runs-on: ubuntu-latest
    env: # $BUNDLE_GEMFILE must be set at the job level, so it is set for all steps
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.gemfile }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "jruby"]
        gemfile:
          - "active_support_7_2"
          - "active_support_8_0"
        exclude:
          - ruby: "jruby"
            gemfile: "active_support_8_0"
    steps:
      - uses: actions/checkout@v2
      - name: Set up CouchDB
        uses: cobot/couchdb-action@bef8173b230f74d4e125852b2402753324fb84f3
        with:
          couchdb version: "2.3.1"
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run tests
        run: bundle exec rake spec_ci
